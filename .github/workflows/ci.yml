name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test package contracts
        run: python -m unittest discover -s tests -v
      - name: Compile plugin Python
        run: python -m py_compile oreslang.py
