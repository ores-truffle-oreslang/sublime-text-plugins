name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Test package contracts
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
      - name: Validate pinned editor lexical contract v1
        run: node --test tests/*.test.cjs
      - name: Compile plugin Python
        run: python -m py_compile oreslang.py
      - name: Build and verify installable Sublime package
        run: python tools/package_sublime.py
      - name: Upload Sublime package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oreslang-sublime-package
          path: dist/Oreslang.sublime-package
          if-no-files-found: error
          retention-days: 14
