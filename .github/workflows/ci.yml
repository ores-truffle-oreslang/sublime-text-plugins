name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 16 * * 5'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Test package contracts
        run: python -m unittest discover -s tests -v
      - name: Compile plugin Python
        run: python -m py_compile oreslang.py

  grammar-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Report compiler grammar drift without executing upstream sources
        run: python scripts/check_upstream_syntax.py --live
