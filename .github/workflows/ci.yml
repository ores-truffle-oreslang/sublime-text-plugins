name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD before executing tests or publishing artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_ci_checkout_head.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Test package contracts
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
      - name: Validate lexical and strict Symbol tests in Node
        run: node --test tests/*.test.cjs
      - name: Compile plugin Python
        run: python -m py_compile oreslang.py
      - name: Validate compiler source pins offline
        run: python scripts/check_upstream_syntax.py
      - name: Build and verify installable Sublime package
        run: python tools/package_sublime.py
      - name: Upload Sublime package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oreslang-sublime-package
          path: dist/Oreslang.sublime-package
          if-no-files-found: error
          retention-days: 14


  sublime-syntax-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD before executing tests or publishing artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_ci_checkout_head.sh
      - name: Execute native Sublime syntax assertions with real engine
        uses: SublimeText/syntax-test-action@872dccb36bdf23a020c4689422d22d8ff38da918 # v2.5.1
        with:
          build: stable
          package_name: Oreslang
          package_root: .

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD before executing tests or publishing artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_ci_checkout_head.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build two identical Sublime package archives and smoke-test contents
        run: |
          python -m unittest discover -s tests -p 'test_release_package.py' -v
          python scripts/build_sublime_package.py --output dist/Oreslang.sublime-package
          python scripts/build_sublime_package.py --output dist/Oreslang.second.sublime-package
          sha256sum dist/Oreslang.sublime-package dist/Oreslang.second.sublime-package
          cmp dist/Oreslang.sublime-package dist/Oreslang.second.sublime-package
      - name: Record local release package SHA256
        run: sha256sum dist/Oreslang.sublime-package
