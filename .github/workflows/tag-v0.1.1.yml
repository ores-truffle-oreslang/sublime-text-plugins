name: Tag Sublime Package v0.1.1

on:
  push:
    branches:
      - publish/v0.1.1

permissions:
  contents: write

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test package contracts
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile oreslang.py
      - name: Create v0.1.1 tag
        run: |
          if git rev-parse -q --verify "refs/tags/v0.1.1" >/dev/null; then
            echo "v0.1.1 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.1 -m "Oreslang Sublime Text plugin v0.1.1"
          git push origin v0.1.1
